name: Build Guiwu IPA
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build IPA
        run: bash Guiwu-iOS/scripts/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Guiwu-unsigned-IPA
          path: Guiwu-iOS/build/Guiwu-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
